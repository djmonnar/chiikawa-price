name: 먼작귀 최저가 수집

on:
  schedule:
    - cron: "17 23 * * *"   # 매일 08:17 (한국시간)
    - cron: "17 9 * * *"    # 매일 18:17 (한국시간)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 가격 수집
        env:
          ELEVENST_API_KEY: ${{ secrets.ELEVENST_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/collect.py
      - name: 결과 저장
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "가격 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          # 수집하는 동안 사이트(상품 관리)에서 목록을 저장했으면 main 이 앞서 있어요 → 받아서 올리기
          git pull --rebase --autostash origin main
          git push
